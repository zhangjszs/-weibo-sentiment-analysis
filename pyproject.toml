# Weibo Sentiment Analysis System
# 微博舆情分析可视化系统

[project]
name = "weibo-sentiment-analysis"
version = "1.0.0"
description = "A Weibo public opinion analysis and visualization system based on Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Weibo Sentiment Team"}
]

# ===== Black 代码格式化配置 =====
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.eggs
    | build
    | dist
    | \.idea
    | cache
    | logs
    | model
)/
'''

# ===== isort 导入排序配置 =====
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", "venv", "__pycache__", ".git", "build", "dist", "cache", "logs"]
known_first_party = ["config", "model", "spider", "utils", "views", "services", "tasks"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ===== pytest 测试配置 =====
# 注意：pytest 只读取 pytest.ini（仓库根目录），此处故意不保留
# [tool.pytest.ini_options]，以 pytest.ini 为唯一真相来源（见 #22）。
# 如需改标记/门禁语义，请改 pytest.ini 并同步 AGENTS.md。

# ===== Coverage 覆盖率配置 =====
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
# 阈值贴近现状（实测 ~65%）留 5% 缓冲；改这里即为唯一真相，CI 无需同步。
fail_under = 60

# ===== MyPy 类型检查配置 (可选) =====
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "tests",
]

# ===== Ruff 快速代码检查配置 (可选替代 flake8) =====
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "cache",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults - 现有代码大量使用此模式，重构风险高
    "B905",   # zip without explicit strict - 现有代码大量使用zip()，添加strict=True可能引入行为变化
]

# E402（import 不在文件顶部）在 tests/ 是既有且必要的模式：测试需要先
# monkeypatch sys.path / os.environ 再导入被测的 src/ 模块，否则被测模块在
# import 期就读取了错误的环境。conftest.py 已统一把 src/ 放进 sys.path，
# 但各测试仍需在自身 import 之前完成各自的前置设置，故不改为 conftest 统一处理。
# 这里按文件设 baseline（见 issue #29），src/ 下 E402 仍然必须清零。
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
