[pytest]
pythonpath = src
testpaths = tests
# Keep noise out of the default run; third-party deprecations are tracked
# separately and must not fail the fast gate.
filterwarnings =
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:google.*
    ignore::PendingDeprecationWarning:celery.*
# Exclude benchmark scripts (benchmark_*.py) — they are runnable manually but
# are not pytest tests and may import optional heavy dependencies.
# NOTE: pytest.ini uses space-separated patterns, NOT a Python list literal.
python_files = test_*.py *_test.py
addopts = -q --maxfail=5

# Default unit+api run skips anything that needs Redis/MySQL/Weibo/remote NLP.
# Run the full matrix locally with:
#   pytest -m "unit or api" -q        # fast gate (default)
#   pytest -m integration -q          # needs local MySQL/SQLite
#   pytest -m external -q             # needs Redis / Weibo cookie / remote NLP
#   pytest -m slow -q                 # performance / stress tests
markers =
    unit: Pure logic, no external services (default gate)
    api: Flask client tests against in-memory app (default gate)
    integration: Needs a real database (SQLite or MySQL)
    external: Needs Redis, Weibo cookie, or remote NLP service
    slow: Performance or stress tests (>2s each)
    database: Tests that touch the database layer
