name: weibo-fullstack

services:
  mysql:
    image: mysql:8.0
    container_name: weibo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wb}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # C1 归档：database/*.sql 已冻结至 docs/database/，此挂载仅为历史兼容；
      # 真实建表以 `alembic upgrade head`（或 Base.metadata.create_all）为准，见 docs/database/README.md
      - ./docs/database/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # 密码由环境传入而非写死在参数里（docker inspect 不可见明文）
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: weibo-redis
    environment:
      # 仅供容器内 command/healthcheck 条件判断；客户端密码链走各服务的 REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # REDIS_PASSWORD 为空时不设密码（--requirepass "" 语义不可靠），非空时启用鉴权
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 有密码时带密码 ping，否则裸 ping；管道 grep 保证退出码语义
      test: ["CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$$REDIS_PASSWORD\" ping; fi | grep -i pong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weibo-backend
    environment:
      # Flask 配置
      FLASK_ENV: ${FLASK_ENV:-development}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 跨域配置
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-weibo_access_token}
      
      # 管理员配置
      ADMIN_USERS: ${ADMIN_USERS:-admin}
      # 安全收紧（评估 P0 #7）：默认不自动创建弱口令 demo 管理员；开发环境显式置 True
      AUTO_CREATE_DEMO_ADMIN: ${AUTO_CREATE_DEMO_ADMIN:-False}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      
      # Redis / Celery 配置
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # 爬虫配置
      WEIBO_COOKIE: ${WEIBO_COOKIE:-}
      WEIBO_USER_AGENT: ${WEIBO_USER_AGENT:-}
      SPIDER_TIMEOUT: ${SPIDER_TIMEOUT:-45}
      SPIDER_DELAY: ${SPIDER_DELAY:-15}
      SPIDER_MAX_RETRIES: ${SPIDER_MAX_RETRIES:-3}
      SPIDER_USE_PROXY: ${SPIDER_USE_PROXY:-False}
      
      # Spider 服务配置（评估 P0 #7：硬编码 "True" 改为可覆盖，全栈默认仍启用）
      SPIDER_SERVICE_ENABLED: ${SPIDER_SERVICE_ENABLED:-True}
      SPIDER_SERVICE_BASE_URL: http://spider-api:8090
      SPIDER_SERVICE_TIMEOUT: ${SPIDER_SERVICE_TIMEOUT:-15}
      SPIDER_SERVICE_TOKEN: ${SPIDER_SERVICE_TOKEN:-}
      SPIDER_SERVICE_FALLBACK_LOCAL: ${SPIDER_SERVICE_FALLBACK_LOCAL:-True}

      # NLP 服务配置
      NLP_SERVICE_ENABLED: ${NLP_SERVICE_ENABLED:-True}
      NLP_SERVICE_BASE_URL: http://nlp-api:8091
      NLP_SERVICE_TIMEOUT: ${NLP_SERVICE_TIMEOUT:-20}
      NLP_SERVICE_TOKEN: ${NLP_SERVICE_TOKEN:-}
      NLP_SERVICE_FALLBACK_LOCAL: ${NLP_SERVICE_FALLBACK_LOCAL:-True}
      
      # LLM 配置
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      
      # 启动预热
      ENABLE_STARTUP_WARMUP: ${ENABLE_STARTUP_WARMUP:-True}
      STARTUP_WARMUP_DELAY: ${STARTUP_WARMUP_DELAY:-0.5}
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # 主应用 Celery worker（评估 P0 #6）：消费 sentiment/default 队列。
  # 此前仅有 spider-worker / nlp-worker，主应用的 celery_sentiment 异步情感分析任务无消费者。
  # 注意：celery 命令不走 run.py，需显式设 PYTHONPATH=/app/src（与 CI 一致）。
  # 未加 beat：当前无 beat_schedule（无周期任务），待预警扫描/变点检测等周期任务落地（P1）再补。
  # 环境变量与 web 对齐（#23）：生产 validate 要求 SECRET/JWT/ALLOWED/ADMIN 齐全，
  # 且 JWT 签名必须与 web 一致，否则 worker 内签发/校验与主应用互不认。
  web-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weibo-web-worker
    environment:
      PYTHONPATH: /app/src
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FLASK_ENV: ${FLASK_ENV:-development}
      DEBUG: ${DEBUG:-False}

      # 鉴权/密钥（必须与 web 一致）
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-weibo_access_token}
      ADMIN_USERS: ${ADMIN_USERS:-admin}

      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}

      # Redis / Celery 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Spider/NLP 服务开关（与 web 一致，避免 worker 内回退逻辑分叉）
      SPIDER_SERVICE_ENABLED: ${SPIDER_SERVICE_ENABLED:-True}
      SPIDER_SERVICE_BASE_URL: http://spider-api:8090
      SPIDER_SERVICE_TIMEOUT: ${SPIDER_SERVICE_TIMEOUT:-15}
      NLP_SERVICE_ENABLED: ${NLP_SERVICE_ENABLED:-True}
      NLP_SERVICE_BASE_URL: http://nlp-api:8091
      NLP_SERVICE_TIMEOUT: ${NLP_SERVICE_TIMEOUT:-20}

      # LLM 配置（smart 模式情感分析需要）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}

      # 情感分析后端（消费 sentiment 队列必须与 web 一致）
      SENTIMENT_BACKEND: ${SENTIMENT_BACKEND:-auto}
      BERT_MODEL_NAME: ${BERT_MODEL_NAME:-IDEA-CCNL/Erlangshen-Roberta-110M-Sentiment}
      BERT_DEVICE: ${BERT_DEVICE:-cpu}
      BERT_FALLBACK_TO_SKLEARN: ${BERT_FALLBACK_TO_SKLEARN:-True}
    command: ["celery", "-A", "tasks.celery_config:celery_app", "worker", "--loglevel=info", "-Q", "sentiment,default"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weibo-frontend
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  spider-api:
    build:
      context: ./spider_service
      dockerfile: Dockerfile
    container_name: weibo-spider-api
    environment:
      # 数据库配置（爬虫服务需要访问数据库）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # 爬虫配置
      WEIBO_COOKIE: ${WEIBO_COOKIE:-}
      WEIBO_USER_AGENT: ${WEIBO_USER_AGENT:-}
      SPIDER_TIMEOUT: ${SPIDER_TIMEOUT:-45}
      SPIDER_DELAY: ${SPIDER_DELAY:-15}
      SPIDER_MAX_RETRIES: ${SPIDER_MAX_RETRIES:-3}
      SPIDER_USE_PROXY: ${SPIDER_USE_PROXY:-False}
      
      # 服务鉴权
      SPIDER_SERVICE_TOKEN: ${SPIDER_SERVICE_TOKEN:-}
    command: ["python", "app/main.py"]
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  spider-worker:
    build:
      context: ./spider_service
      dockerfile: Dockerfile
    container_name: weibo-spider-worker
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # 爬虫配置
      WEIBO_COOKIE: ${WEIBO_COOKIE:-}
      WEIBO_USER_AGENT: ${WEIBO_USER_AGENT:-}
      SPIDER_TIMEOUT: ${SPIDER_TIMEOUT:-45}
      SPIDER_DELAY: ${SPIDER_DELAY:-15}
      SPIDER_MAX_RETRIES: ${SPIDER_MAX_RETRIES:-3}
      SPIDER_USE_PROXY: ${SPIDER_USE_PROXY:-False}
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "-Q", "spider,default"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nlp-api:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: weibo-nlp-api
    environment:
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Phase 3.8: HTTP 透传到主后端
      NLP_BACKEND_URL: http://web:5000
      NLP_BACKEND_TIMEOUT: ${NLP_BACKEND_TIMEOUT:-20}

      # LLM 配置
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}

      # 服务鉴权
      NLP_SERVICE_TOKEN: ${NLP_SERVICE_TOKEN:-}
    command: ["python", "app/main.py"]
    ports:
      - "8091:8091"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nlp-worker:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: weibo-nlp-worker
    environment:
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Phase 3.8: HTTP 透传到主后端
      NLP_BACKEND_URL: http://web:5000
      NLP_BACKEND_TIMEOUT: ${NLP_BACKEND_TIMEOUT:-20}

      # LLM 配置
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "-Q", "nlp,default"]
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
