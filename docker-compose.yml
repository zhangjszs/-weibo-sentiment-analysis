name: weibo-fullstack

services:
  mysql:
    image: mysql:8.0
    container_name: weibo-mysql
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wb}
      MYSQL_USER: ${MYSQL_USER:-weibo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    entrypoint:
      - sh
      - -ec
      - |
        valid_password() {
          case "$$1" in *[!0-9a-fA-F]*|'') return 1 ;; esac
          [ "$${#1}" -ge 32 ]
        }
        if ! valid_password "$$MYSQL_ROOT_PASSWORD" || ! valid_password "$$MYSQL_PASSWORD"; then
          echo "MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD must be random hex strings of at least 32 characters" >&2
          exit 1
        fi
        if [ "$$MYSQL_ROOT_PASSWORD" = "$$MYSQL_PASSWORD" ]; then
          echo "MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD must be different" >&2
          exit 1
        fi
        exec docker-entrypoint.sh mysqld "$$@"
      - mysql-preflight
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      # 空卷先创建无账户的兼容基础表，后续 schema 变更走 Alembic。
      - ./docs/database/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: weibo-redis
    environment:
      # 仅供容器内 command/healthcheck 条件判断；客户端密码链走各服务的 REDIS_PASSWORD
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in
          *[!0-9a-fA-F]*|'') echo "REDIS_PASSWORD must be a random hex string of at least 32 characters" >&2; exit 1 ;;
        esac
        if [ "$${#REDIS_PASSWORD}" -lt 32 ]; then
          echo "REDIS_PASSWORD must be a random hex string of at least 32 characters" >&2
          exit 1
        fi
        exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weibo-backend
    environment:
      # Flask 配置
      FLASK_ENV: ${FLASK_ENV:-development}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique random value in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a unique random value in .env}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 跨域配置
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-weibo_access_token}
      
      # 管理员配置
      ADMIN_USERS: ${ADMIN_USERS:-}
      # Compose 一律通过运维命令显式创建管理员。
      AUTO_CREATE_DEMO_ADMIN: "False"
      
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-weibo}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      
      # Redis / Celery 配置
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # 爬虫配置
      WEIBO_COOKIE: ${WEIBO_COOKIE:-}
      WEIBO_USER_AGENT: ${WEIBO_USER_AGENT:-}
      SPIDER_TIMEOUT: ${SPIDER_TIMEOUT:-45}
      SPIDER_DELAY: ${SPIDER_DELAY:-15}
      SPIDER_MAX_RETRIES: ${SPIDER_MAX_RETRIES:-3}
      SPIDER_USE_PROXY: ${SPIDER_USE_PROXY:-False}
      
      COMPOSE_REQUIRE_SERVICE_TOKENS: "True"
      # Spider 服务配置
      SPIDER_SERVICE_ENABLED: ${SPIDER_SERVICE_ENABLED:-True}
      SPIDER_SERVICE_BASE_URL: http://spider-api:8090
      SPIDER_SERVICE_TIMEOUT: ${SPIDER_SERVICE_TIMEOUT:-15}
      SPIDER_SERVICE_TOKEN: ${SPIDER_SERVICE_TOKEN:?Set SPIDER_SERVICE_TOKEN in .env}
      SPIDER_SERVICE_FALLBACK_LOCAL: ${SPIDER_SERVICE_FALLBACK_LOCAL:-True}

      # NLP 服务配置
      NLP_SERVICE_ENABLED: ${NLP_SERVICE_ENABLED:-False}
      NLP_SERVICE_BASE_URL: http://nlp-api:8091
      NLP_SERVICE_TIMEOUT: ${NLP_SERVICE_TIMEOUT:-20}
      NLP_SERVICE_TOKEN: ${NLP_SERVICE_TOKEN:?Set NLP_SERVICE_TOKEN in .env}
      NLP_SERVICE_FALLBACK_LOCAL: ${NLP_SERVICE_FALLBACK_LOCAL:-True}
      
      # LLM 配置
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      
      # 启动预热
      ENABLE_STARTUP_WARMUP: ${ENABLE_STARTUP_WARMUP:-True}
      STARTUP_WARMUP_DELAY: ${STARTUP_WARMUP_DELAY:-0.5}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # 主应用 Celery worker（评估 P0 #6）：消费 sentiment/default 队列。
  # 此前仅有 spider-worker / nlp-worker，主应用的 celery_sentiment 异步情感分析任务无消费者。
  # 注意：celery 命令不走 run.py，需显式设 PYTHONPATH=/app/src（与 CI 一致）。
  # 未加 beat：当前无 beat_schedule（无周期任务），待预警扫描/变点检测等周期任务落地（P1）再补。
  # 环境变量与 web 对齐（#23）：生产 validate 要求 SECRET/JWT/ALLOWED/ADMIN 齐全，
  # 且 JWT 签名必须与 web 一致，否则 worker 内签发/校验与主应用互不认。
  web-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weibo-web-worker
    environment:
      PYTHONPATH: /app/src
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FLASK_ENV: ${FLASK_ENV:-development}
      DEBUG: ${DEBUG:-False}

      # 鉴权/密钥（必须与 web 一致）
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique random value in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a unique random value in .env}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-weibo_access_token}
      ADMIN_USERS: ${ADMIN_USERS:-}

      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-weibo}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}

      # Redis / Celery 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Spider/NLP 服务开关（与 web 一致，避免 worker 内回退逻辑分叉）
      SPIDER_SERVICE_ENABLED: ${SPIDER_SERVICE_ENABLED:-True}
      SPIDER_SERVICE_BASE_URL: http://spider-api:8090
      SPIDER_SERVICE_TIMEOUT: ${SPIDER_SERVICE_TIMEOUT:-15}
      NLP_SERVICE_ENABLED: ${NLP_SERVICE_ENABLED:-False}
      NLP_SERVICE_BASE_URL: http://nlp-api:8091
      NLP_SERVICE_TIMEOUT: ${NLP_SERVICE_TIMEOUT:-20}

      # LLM 配置（smart 模式情感分析需要）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}

      # 情感分析后端（消费 sentiment 队列必须与 web 一致）
      SENTIMENT_BACKEND: ${SENTIMENT_BACKEND:-auto}
      BERT_MODEL_NAME: ${BERT_MODEL_NAME:-IDEA-CCNL/Erlangshen-Roberta-110M-Sentiment}
      BERT_DEVICE: ${BERT_DEVICE:-cpu}
      BERT_FALLBACK_TO_SKLEARN: ${BERT_FALLBACK_TO_SKLEARN:-True}
    command:
      - sh
      - -ec
      - |
        python -c 'from config.settings import Config; Config.validate()'
        exec celery -A tasks.celery_config:celery_app worker --loglevel=info -Q sentiment,default
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weibo-frontend
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  spider-api:
    build:
      context: ./spider_service
      dockerfile: Dockerfile
    container_name: weibo-spider-api
    environment:
      # 数据库配置（爬虫服务需要访问数据库）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-weibo}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # 爬虫配置
      WEIBO_COOKIE: ${WEIBO_COOKIE:-}
      WEIBO_USER_AGENT: ${WEIBO_USER_AGENT:-}
      SPIDER_TIMEOUT: ${SPIDER_TIMEOUT:-45}
      SPIDER_DELAY: ${SPIDER_DELAY:-15}
      SPIDER_MAX_RETRIES: ${SPIDER_MAX_RETRIES:-3}
      SPIDER_USE_PROXY: ${SPIDER_USE_PROXY:-False}
      
      # 服务鉴权
      SPIDER_SERVICE_TOKEN: ${SPIDER_SERVICE_TOKEN:?Set SPIDER_SERVICE_TOKEN in .env}
    command: ["python", "app/main.py"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  spider-worker:
    build:
      context: ./spider_service
      dockerfile: Dockerfile
    container_name: weibo-spider-worker
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-weibo}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-wb}
      
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # 爬虫配置
      WEIBO_COOKIE: ${WEIBO_COOKIE:-}
      WEIBO_USER_AGENT: ${WEIBO_USER_AGENT:-}
      SPIDER_TIMEOUT: ${SPIDER_TIMEOUT:-45}
      SPIDER_DELAY: ${SPIDER_DELAY:-15}
      SPIDER_MAX_RETRIES: ${SPIDER_MAX_RETRIES:-3}
      SPIDER_USE_PROXY: ${SPIDER_USE_PROXY:-False}
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "-Q", "spider,default"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nlp-api:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: weibo-nlp-api
    environment:
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Phase 3.8: HTTP 透传到主后端
      NLP_BACKEND_URL: http://web:5000
      NLP_BACKEND_TIMEOUT: ${NLP_BACKEND_TIMEOUT:-20}

      # LLM 配置
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}

      # 服务鉴权
      NLP_SERVICE_TOKEN: ${NLP_SERVICE_TOKEN:?Set NLP_SERVICE_TOKEN in .env}
    command: ["python", "app/main.py"]
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nlp-worker:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: weibo-nlp-worker
    environment:
      # Redis 配置（REDIS_PASSWORD 缺一不可：应用侧会回填进 broker URL，见 #23）
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Phase 3.8: HTTP 透传到主后端
      NLP_BACKEND_URL: http://web:5000
      NLP_BACKEND_TIMEOUT: ${NLP_BACKEND_TIMEOUT:-20}

      # LLM 配置
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "-Q", "nlp,default"]
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # ---- 可观测性（#99，默认不启动）：docker compose --profile observability up ----
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: weibo-jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP（traces + metrics）
      - "4317:4317" # OTLP gRPC
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: weibo-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docs/observability/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4319:4318" # 备用 OTLP HTTP 入口（宿主 4319，避免与 Jaeger 4318 冲突）
    depends_on:
      - jaeger
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
