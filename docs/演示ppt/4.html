<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据采集与处理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Roboto:wght@300;400;700;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .section-card {
            background-color: var(--card-bg-color);
            border: 1px solid var(--card-border-color);
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .section-card:hover {
            transform: translateY(-8px);
            border-color: var(--edge-blue);
            box-shadow: 0 10px 25px -5px rgba(0, 161, 241, 0.15), 0 8px 10px -6px rgba(0, 161, 241, 0.1);
        }

        .section-title { color: var(--text-color-base); }
        .section-title i, .data-icon i { color: var(--edge-blue); }

        .data-desc { color: var(--text-color-caption); }

        .process-step {
            background-color: #F3F4F6;
            transition: background-color 0.3s ease-out, transform 0.3s ease-out;
            border: 1px solid var(--card-border-color);
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .process-step:hover {
            background-color: var(--card-border-color);
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(0, 161, 241, 0.3);
        }

        .process-step i { color: var(--edge-blue); }
        .process-step-title { color: var(--text-color-base); }
        .process-step-desc { color: var(--text-color-caption); }

        .icon-valign { padding-top: 0.2rem; }
    </style>
</head>

<body class="bg-white">
<div class="slide min-h-screen flex items-center justify-center p-6 md:p-12">
    <div class="content w-full max-w-7xl mx-auto flex flex-col items-center">
        <h1 class="main-title animate-fadeInUp">
            <span class="title-black-part">数据采集与</span><span class="title-gradient-part">处理</span>
            <span class="en-label-small mt-2">Data Collection & Processing</span>
        </h1>

        <div class="content-container flex flex-col md:flex-row gap-8 md:gap-10 w-full">

            <div class="section section-card flex-1 p-8 rounded-xl animate-fadeInUp" style="animation-delay: 0.2s;">
                <div class="section-title text-3xl md:text-4xl font-bold mb-6 flex items-center">
                    <i class="fas fa-spider text-3xl md:text-4xl mr-4"></i> 数据来源与采集方法
                </div>
                <div class="section-content space-y-5">
                    <div class="data-item flex items-start">
                        <div class="data-icon icon-valign w-7 text-center mr-4 text-xl flex-shrink-0">
                            <i class="fas fa-code"></i>
                        </div>
                        <div class="data-text flex-1">
                            <div class="data-title font-semibold text-lg mb-1">微博数据爬取</div>
                            <div class="data-desc text-base leading-relaxed">
                                使用Scrapy框架支持多线程和分布式爬取，提高采集效率；或通过微博API接口获取稳定数据源。
                            </div>
                        </div>
                    </div>
                    <div class="data-item flex items-start">
                        <div class="data-icon icon-valign w-7 text-center mr-4 text-xl flex-shrink-0">
                            <i class="far fa-comment"></i>
                        </div>
                        <div class="data-text flex-1">
                            <div class="data-title font-semibold text-lg mb-1">微博内容</div>
                            <div class="data-desc text-base leading-relaxed">
                                舆情分析的核心数据，反映用户观点和态度。
                            </div>
                        </div>
                    </div>
                    <div class="data-item flex items-start">
                        <div class="data-icon icon-valign w-7 text-center mr-4 text-xl flex-shrink-0">
                            <i class="fas fa-reply-all"></i>
                        </div>
                        <div class="data-text flex-1">
                            <div class="data-title font-semibold text-lg mb-1">评论数据</div>
                            <div class="data-desc text-base leading-relaxed">
                                深入了解用户对微博内容的看法，补充和丰富舆情信息。
                            </div>
                        </div>
                    </div>
                    <div class="data-item flex items-start">
                        <div class="data-icon icon-valign w-7 text-center mr-4 text-xl flex-shrink-0">
                            <i class="fas fa-retweet"></i>
                        </div>
                        <div class="data-text flex-1">
                            <div class="data-title font-semibold text-lg mb-1">转发数据</div>
                            <div class="data-desc text-base leading-relaxed">
                                体现微博的传播范围和影响力，是衡量舆情热度的重要指标。
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section section-card flex-1 p-8 rounded-xl animate-fadeInUp" style="animation-delay: 0.4s;">
                <div class="section-title text-3xl md:text-4xl font-bold mb-6 flex items-center">
                    <i class="fas fa-cogs text-3xl md:text-4xl mr-4"></i> 数据预处理
                </div>
                <div class="flow-diagram flex flex-col space-y-6">
                    <div class="process-row flex flex-col sm:flex-row gap-4 sm:gap-6">
                        <div class="process-step flex-1 p-4 rounded-lg text-center animate-fadeInUp" style="animation-delay: 0.5s;">
                            <i class="fas fa-broom text-2xl mb-3"></i>
                            <div class="process-step-title text-base font-semibold mb-1">数据清洗</div>
                            <div class="process-step-desc text-sm">去重、去噪、填补缺失值</div>
                        </div>
                        <div class="process-step flex-1 p-4 rounded-lg text-center animate-fadeInUp" style="animation-delay: 0.6s;">
                            <i class="fas fa-ruler-combined text-2xl mb-3"></i>
                            <div class="process-step-title text-base font-semibold mb-1">数据标准化</div>
                            <div class="process-step-desc text-sm">格式统一、时间戳处理</div>
                        </div>
                    </div>
                    <div class="process-row flex flex-col sm:flex-row gap-4 sm:gap-6">
                        <div class="process-step flex-1 p-4 rounded-lg text-center animate-fadeInUp" style="animation-delay: 0.7s;">
                            <i class="far fa-smile text-2xl mb-3"></i>
                            <div class="process-step-title text-base font-semibold mb-1">情感分析</div>
                            <div class="process-step-desc text-sm">正负中性情感倾向识别</div>
                        </div>
                        <div class="process-step flex-1 p-4 rounded-lg text-center animate-fadeInUp" style="animation-delay: 0.8s;">
                            <i class="fas fa-hashtag text-2xl mb-3"></i>
                            <div class="process-step-title text-base font-semibold mb-1">关键词提取</div>
                            <div class="process-step-desc text-sm">话题分析与热点识别</div>
                        </div>
                    </div>
                    <div class="process-row flex flex-col sm:flex-row gap-4 sm:gap-6">
                        <div class="process-step flex-1 p-4 rounded-lg text-center animate-fadeInUp" style="animation-delay: 0.9s;">
                            <i class="fas fa-brain text-2xl mb-3"></i>
                            <div class="process-step-title text-base font-semibold mb-1">数据增强</div>
                            <div class="process-step-desc text-sm">文本特征提取与扩展</div>
                        </div>
                        <div class="process-step flex-1 p-4 rounded-lg text-center animate-fadeInUp" style="animation-delay: 1.0s;">
                            <i class="fas fa-database text-2xl mb-3"></i>
                            <div class="process-step-title text-base font-semibold mb-1">数据存储</div>
                            <div class="process-step-desc text-sm">结构化数据入库与索引</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.SLIDE_CONFIG = {
        prevSlideURL: '3.html',
        nextSlideURL: '5.html',
        totalSlides: 11,
        currentPage: 5
    };
</script>
<script src="slide-nav.js"></script>

</body>
</html>
