name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Fast backend gate: lint + unit/api tests (no external services) ---
  backend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU 版 torch（默认会拉数 GB 的 CUDA 包，又慢又 OOM），见 requirements 注释
          pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Backend fast tests (unit + api)
        env:
          # development = 文档值；testing 会关掉 IS_DEVELOPMENT 使行为与本地不一致
          FLASK_ENV: development
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-characters-long
          JWT_SECRET_KEY: ci-test-jwt-secret-key-must-be-at-least-32-characters-long
          ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          ADMIN_USERS: admin
        run: |
          pytest -m "unit or api" -q --maxfail=1

  # --- Frontend gate: lint + build ---
  frontend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  # --- Integration tests: needs MySQL + Redis ---
  # PR 即跑（此前只在 main push 后跑，坏迁移合入才爆）；external/slow 仍手动/定时。
  integration:
    runs-on: ubuntu-latest
    needs: [backend-fast, frontend-fast]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: weibo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Initialize test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: weibo_test
        run: |
          # 冻结 SQL 建表（迁移链 baseline 为空，不建核心表），再跑迁移验证链健康
          sed 's/`wb`/`weibo_test`/g' docs/database/init_database.sql | mysql -h 127.0.0.1 -u root -proot
          alembic upgrade head

      - name: Integration tests
        env:
          FLASK_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: weibo_test
          # 必须显式导出：conftest 只在未指定时才回退到内存 SQLite。
          # 不给这行，集成测试会悄悄跑在 SQLite 上，MySQL 服务形同虚设。
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/weibo_test?charset=utf8mb4
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-characters-long
          JWT_SECRET_KEY: ci-test-jwt-secret-key-must-be-at-least-32-characters-long
          ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          ADMIN_USERS: admin
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -m "integration" -q --maxfail=1
