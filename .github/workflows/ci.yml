name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        # 升级到 MySQL 8.0（与 docker-compose 对齐）
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: weibo_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 先装 CPU 版 torch，避免从 PyPI 拉 GPU 大包（torch>=2.2,<3.0 已被满足）
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt

    - name: Ruff check
      run: ruff check src/

    # black/mypy 暂为软门：现有代码未全量格式化/类型补全，Phase 5 收尾后改硬
    - name: Black check (soft until Phase 5)
      continue-on-error: true
      run: black --check src/ tests/

    - name: Mypy (soft until Phase 5)
      continue-on-error: true
      run: mypy src/

    - name: Bandit security scan
      run: bandit -r src/ -ll -x tests/

    - name: Initialize test database
      run: |
        sed 's/`wb`/`weibo_test`/g' database/init_database.sql | mysql -h 127.0.0.1 -u root -proot

    - name: Run Unit Tests
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: weibo_test
        SECRET_KEY: ci-test-secret-key-must-be-at-least-32-characters-long
        JWT_SECRET_KEY: ci-test-jwt-secret-key-must-be-at-least-32-characters-long
        REDIS_URL: redis://localhost:6379/0
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      run: |
        pytest tests/ --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build backend Docker image
      run: docker build . --file Dockerfile --tag weibo-backend:latest

    - name: Build spider service image
      run: docker build -t test-spider spider_service/

    - name: Build nlp service image
      run: docker build -t test-nlp nlp_service/
