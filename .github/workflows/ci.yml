name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Fast backend gate: lint + unit/api tests (no external services) ---
  backend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #50：文档死链门禁——README/docs 中反引号引用的文件路径必须存在。
      # 纯标准库脚本，无需项目依赖；放 CI 而非 pre-commit：CI 对每次
      # push/PR 强制生效，不依赖开发者本地安装钩子（CI 不跑 pre-commit）。
      - name: Documented paths check
        run: python3 scripts/check_documented_paths.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU 版 torch（默认会拉数 GB 的 CUDA 包，又慢又 OOM），见 requirements 注释
          pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Backend fast tests (unit + api)
        env:
          # development = 文档值；testing 会关掉 IS_DEVELOPMENT 使行为与本地不一致
          FLASK_ENV: development
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-characters-long
          JWT_SECRET_KEY: ci-test-jwt-secret-key-must-be-at-least-32-characters-long
          ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          ADMIN_USERS: admin
        run: |
          # --cov 激活 pyproject.toml 的覆盖率门禁（fail_under=50 为唯一真相）
          pytest -m "unit or api" -q --maxfail=1 --cov=src --cov-report=term-missing

  # --- Frontend gate: lint + build ---
  frontend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      # #51：Prettier 格式门禁——与 lint 同级，失败即红。
      # 格式规则归属 Prettier（eslint 侧已关闭 5 条冲突的纯格式规则）。
      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # #48：首屏体积预算门禁——构建后比对 dist/index.html 实载的入口 JS /
      # 首屏 CSS 与 bundle-budget.json，超限 exit 1。守住 M2 传输体积收益。
      - name: Bundle budget check
        working-directory: frontend
        run: npm run check:bundle

  # --- Integration tests: needs MySQL + Redis ---
  # PR 即跑（此前只在 main push 后跑，坏迁移合入才爆）；external/slow 仍手动/定时。
  integration:
    runs-on: ubuntu-latest
    needs: [backend-fast, frontend-fast]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: weibo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Initialize test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: weibo_test
        run: |
          # 冻结 SQL 建表（迁移链 baseline 为空，不建核心表），再跑迁移验证链健康
          sed 's/`wb`/`weibo_test`/g' docs/database/init_database.sql | mysql -h 127.0.0.1 -u root -proot
          alembic upgrade head

      - name: Integration tests
        env:
          FLASK_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: weibo_test
          # 必须显式导出：conftest 只在未指定时才回退到内存 SQLite。
          # 不给这行，集成测试会悄悄跑在 SQLite 上，MySQL 服务形同虚设。
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/weibo_test?charset=utf8mb4
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-characters-long
          JWT_SECRET_KEY: ci-test-jwt-secret-key-must-be-at-least-32-characters-long
          ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          ADMIN_USERS: admin
          REDIS_URL: redis://localhost:6379/0
        run: |
          # #41：integration 只出覆盖率报告，不设阈值（D-04：integration 用例少，
          # 单独阈值会失真）。--cov-fail-under=0 覆盖 pyproject 的全局 fail_under=60
          #（该值只对 backend-fast 生效），确保低覆盖率不会把 job 染红。
          # 不在此处传 -q：pytest.ini addopts 已有 -q --maxfail=1，重复传会叠成
          # -qq，pytest 将抑制 "N passed" 汇总行（本地实测）。
          pytest -m "integration" --maxfail=1 \
            --cov=src --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage-integration.xml --cov-fail-under=0

      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: coverage-integration.xml
          retention-days: 14
