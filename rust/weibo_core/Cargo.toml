[package]
name = "weibo_core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust-accelerated core for weibo sentiment analysis (optional PyO3 extension)"

[lib]
name = "weibo_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dedup"
harness = false

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 0
